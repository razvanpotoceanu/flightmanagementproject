<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editează Avion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1>Editează Avion</h1>
    <form th:action="@{/airplanes/{id}/edit(id=${airplane.id})}" th:object="${airplane}" method="post" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label class="form-label">ID:</label>
            <input type="text" th:field="*{id}" readonly class="form-control bg-light">
        </div>
        <div class="mb-3">
            <label class="form-label">Model:</label>
            <input type="text" th:field="*{modelName}" class="form-control" th:classappend="${#fields.hasErrors('modelName')} ? 'is-invalid' : ''">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('modelName')}" th:errors="*{modelName}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Capacitate:</label>
            <input type="number" th:field="*{capacity}" class="form-control" th:classappend="${#fields.hasErrors('capacity')} ? 'is-invalid' : ''">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}"></div>
        </div>
        <button type="submit" class="btn btn-warning">Actualizează</button>
        <a th:href="@{/airplanes}" class="btn btn-secondary">Anulează</a>
    </form>
</div>
</body>
</html>
