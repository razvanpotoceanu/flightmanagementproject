<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalii Angajat Aeroport</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h2>Detalii Angajat (Aeroport)</h2>
        </div>
        <div class="card-body">
            <p><strong>ID:</strong> <span th:text="${employee.id}"></span></p>
            <p><strong>Nume:</strong> <span th:text="${employee.name}"></span></p>
            <p><strong>Funcție:</strong> <span th:text="${employee.designation}"></span></p>
            <p><strong>Departament:</strong> <span th:text="${employee.department}"></span></p>
        </div>
        <div class="card-footer">
            <a th:href="@{/airport-employees}" class="btn btn-secondary">Înapoi</a>
        </div>
    </div>
</div>
</body>
</html>
