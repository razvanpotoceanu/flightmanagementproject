<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalii Zbor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h2>Detalii Zbor</h2>
        </div>
        <div class="card-body">
            <p><strong>ID:</strong> <span th:text="${flight.id}"></span></p>
            <p><strong>Nr. Zbor:</strong> <span th:text="${flight.flightNumber}"></span></p>
            <p><strong>Plecare:</strong> <span th:text="${flight.departureTime}"></span></p>
            <p><strong>Sosire:</strong> <span th:text="${flight.arrivalTime}"></span></p>

            <hr>

            <p><strong>Avion:</strong>
                <span th:text="${flight.airplane != null ? flight.airplane.modelName : 'Nespecificat'}" class="badge bg-info"></span>
            </p>
            <p><strong>Panou Afișaj:</strong>
                <span th:text="${flight.noticeBoard != null ? flight.noticeBoard.date : 'Nespecificat'}" class="badge bg-secondary"></span>
            </p>

            <h4 class="mt-4">Bilete Vândute (<span th:text="${#lists.size(flight.tickets)}">0</span>)</h4>
            <ul class="list-group" th:if="${not #lists.isEmpty(flight.tickets)}">
                <li class="list-group-item" th:each="t : ${flight.tickets}" th:text="${'Loc: ' + t.seatNumber + ' (Preț: ' + t.price + ')'}"></li>
            </ul>

            <h4 class="mt-4">Personal Asignat (<span th:text="${#lists.size(flight.flightAssignments)}">0</span>)</h4>
            <ul class="list-group" th:if="${not #lists.isEmpty(flight.flightAssignments)}">
                <li class="list-group-item" th:each="assignment : ${flight.flightAssignments}">
                    <span th:if="${assignment.airlineEmployee != null}" th:text="${assignment.airlineEmployee.name + ' (Airline)'}"></span>
                    <span th:if="${assignment.airportEmployee != null}" th:text="${assignment.airportEmployee.name + ' (Airport)'}"></span>
                </li>
            </ul>

        </div>
        <div class="card-footer">
            <a th:href="@{/flights}" class="btn btn-secondary">Înapoi</a>
            <a th:href="@{/flights/{id}/edit(id=${flight.id})}" class="btn btn-warning">Editează</a>
        </div>
    </div>
</div>
</body>
</html>
