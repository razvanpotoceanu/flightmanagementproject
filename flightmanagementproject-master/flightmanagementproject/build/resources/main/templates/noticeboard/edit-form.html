<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editează Panou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1>Editează Panou</h1>
    <form th:action="@{/noticeboards/{id}/edit(id=${noticeboard.id})}" th:object="${noticeboard}" method="post" class="card p-4 shadow-sm">

        <div class="mb-3">
            <label class="form-label">ID:</label>
            <input type="text" th:field="*{id}" readonly class="form-control bg-light">
        </div>

        <div class="mb-3">
            <label class="form-label">Data Panoului:</label>
            <input type="date" th:field="*{date}" class="form-control" th:classappend="${#fields.hasErrors('date')} ? 'is-invalid' : ''">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div>
        </div>

        <button type="submit" class="btn btn-warning">Actualizează</button>
        <a th:href="@{/noticeboards}" class="btn btn-secondary">Anulează</a>
    </form>
</div>
</body>
</html>
