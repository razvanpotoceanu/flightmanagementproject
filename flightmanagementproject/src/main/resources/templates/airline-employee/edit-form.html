<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editează Angajat Companie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1>Editează Angajat Companie</h1>
    <form th:action="@{/airline-employees/{id}/edit(id=${employee.id})}" th:object="${employee}" method="post" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label class="form-label">ID:</label>
            <input type="text" th:field="*{id}" readonly class="form-control bg-light">
        </div>

        <div class="mb-3">
            <label class="form-label">Nume:</label>
            <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Rol:</label>
            <select th:field="*{role}" class="form-select" th:classappend="${#fields.hasErrors('role')} ? 'is-invalid' : ''">
                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
        </div>

        <button type="submit" class="btn btn-warning">Actualizează</button>
        <a th:href="@{/airline-employees}" class="btn btn-secondary">Anulează</a>
    </form>
</div>
</body>
</html>
