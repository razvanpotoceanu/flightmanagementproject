<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Staff Companie Aeriană</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"><i class="fas fa-plane"></i> FlightApp</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/passengers}">Pasageri</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/flights}">Zboruri</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/airplanes}">Avioane</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/tickets}">Bilete</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/assignments}">Asignări</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Staff</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/airline-employees}">Companie</a></li>
                        <li><a class="dropdown-item" th:href="@{/airport-employees}">Aeroport</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-primary">Staff Companie Aeriană</h1>
        <div>
            <a th:href="@{/airline-employees/new}" class="btn btn-success"><i class="fas fa-plus"></i> Adaugă</a>
            <a th:href="@{/}" class="btn btn-secondary">Acasă</a>
        </div>
    </div>

    <!-- Formular de Filtrare -->
    <form th:action="@{/airline-employees}" method="get" class="card p-3 mb-4 shadow-sm">
        <div class="input-group">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Caută după nume...">
            <input type="hidden" name="sortField" th:value="${sortField}">
            <input type="hidden" name="sortDir" th:value="${sortDir}">
            <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i> Caută</button>
            <a th:href="@{/airline-employees}" class="btn btn-outline-secondary">Reset</a>
        </div>
    </form>

    <div class="card shadow-sm">
        <table class="table table-striped table-hover mb-0">
            <thead class="table-dark">
            <tr>
                <th>
                    <a th:href="@{/airline-employees(sortField='id', sortDir=${reverseSortDir}, keyword=${keyword})}" class="text-white text-decoration-none">
                        ID <i th:if="${sortField == 'id'}" th:class="${sortDir == 'asc' ? 'fas fa-sort-up' : 'fas fa-sort-down'}"></i>
                    </a>
                </th>
                <th>
                    <a th:href="@{/airline-employees(sortField='name', sortDir=${reverseSortDir}, keyword=${keyword})}" class="text-white text-decoration-none">
                        Nume <i th:if="${sortField == 'name'}" th:class="${sortDir == 'asc' ? 'fas fa-sort-up' : 'fas fa-sort-down'}"></i>
                    </a>
                </th>
                <th>Rol</th>
                <th>Acțiuni</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="emp : ${employees}">
                <td th:text="${emp.id}"></td>
                <td>
                    <a th:href="@{/airline-employees/{id}(id=${emp.id})}" th:text="${emp.name}" class="fw-bold text-decoration-none"></a>
                </td>
                <td th:text="${emp.role}"></td>
                <td>
                    <a th:href="@{/airline-employees/{id}/edit(id=${emp.id})}" class="btn btn-sm btn-warning"><i class="fas fa-edit"></i></a>
                    <form th:action="@{/airline-employees/{id}/delete(id=${emp.id})}" method="post" style="display:inline;" onsubmit="return confirm('Ștergi acest angajat?');">
                        <button type="submit" class="btn btn-sm btn-danger"><i class="fas fa-trash"></i></button>
                    </form>
                </td>
            </tr>
            <tr th:if="${employees.empty}">
                <td colspan="4" class="text-center text-muted">Nu s-au găsit angajați.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-3">
        <a th:href="@{/airport-employees}" class="btn btn-outline-primary btn-sm">Vezi Staff Aeroport</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
