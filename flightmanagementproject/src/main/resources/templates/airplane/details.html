<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalii Avion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white"><h2>Detalii Avion</h2></div>
        <div class="card-body">
            <p><strong>ID:</strong> <span th:text="${airplane.id}"></span></p>
            <p><strong>Model:</strong> <span th:text="${airplane.modelName}"></span></p>
            <p><strong>Capacitate:</strong> <span th:text="${airplane.capacity}"></span></p>
            <h4>Zboruri Asociate</h4>
            <ul class="list-group" th:if="${not #lists.isEmpty(airplane.flights)}">
                <li class="list-group-item" th:each="f : ${airplane.flights}" th:text="${f.flightNumber}"></li>
            </ul>
        </div>
        <div class="card-footer">
            <a th:href="@{/airplanes}" class="btn btn-secondary">Înapoi</a>
        </div>
    </div>
</div>
</body>
</html>
