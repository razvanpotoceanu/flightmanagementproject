<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalii Asignare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white"><h2>Detalii Asignare</h2></div>
        <div class="card-body">
            <p><strong>ID Asignare:</strong> <span th:text="${assignment.id}"></span></p>

            <h4 class="mt-3">Detalii Zbor</h4>
            <div th:if="${assignment.flight != null}">
                <p><strong>Nr. Zbor:</strong> <span th:text="${assignment.flight.flightNumber}"></span></p>
                <p><strong>Plecare:</strong> <span th:text="${assignment.flight.departureTime}"></span></p>
                <p><strong>Sosire:</strong> <span th:text="${assignment.flight.arrivalTime}"></span></p>
            </div>
            <div th:if="${assignment.flight == null}" class="text-danger">Zbor șters.</div>

            <h4 class="mt-3">Detalii Angajat Asignat</h4>
            <div th:if="${assignment.airlineEmployee != null}">
                <p><strong>Tip:</strong> <span class="badge bg-primary">Companie Aeriană</span></p>
                <p><strong>Nume:</strong> <span th:text="${assignment.airlineEmployee.name}"></span></p>
                <p><strong>Rol:</strong> <span th:text="${assignment.airlineEmployee.role}"></span></p>
            </div>
            <div th:if="${assignment.airportEmployee != null}">
                <p><strong>Tip:</strong> <span class="badge bg-success">Aeroport</span></p>
                <p><strong>Nume:</strong> <span th:text="${assignment.airportEmployee.name}"></span></p>
                <p><strong>Funcție:</strong> <span th:text="${assignment.airportEmployee.designation}"></span></p>
            </div>
            <div th:if="${assignment.airlineEmployee == null and assignment.airportEmployee == null}" class="text-danger">Niciun angajat asociat.</div>
        </div>
        <div class="card-footer">
            <a th:href="@{/assignments}" class="btn btn-secondary">Înapoi</a>
            <a th:href="@{/assignments/{id}/edit(id=${assignment.id})}" class="btn btn-warning">Editează</a>
        </div>
    </div>
</div>
</body>
</html>
