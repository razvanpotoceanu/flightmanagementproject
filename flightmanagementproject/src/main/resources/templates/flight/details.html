<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalii Zbor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h2>Detalii Zbor</h2>
        </div>
        <div class="card-body">
            <p><strong>ID:</strong> <span th:text="${flight.id}"></span></p>
            <p><strong>Nr. Zbor:</strong> <span th:text="${flight.flightNumber}"></span></p>
            <p><strong>Plecare:</strong> <span th:text="${flight.departureTime}"></span></p>
            <p><strong>Sosire:</strong> <span th:text="${flight.arrivalTime}"></span></p>
            <p><strong>Avion:</strong> <span th:text="${flight.airplane != null ? flight.airplane.modelName : 'Nespecificat'}"></span></p>
            <p><strong>Panou:</strong> <span th:text="${flight.noticeBoard != null ? flight.noticeBoard.date : 'Nespecificat'}"></span></p>
        </div>
        <div class="card-footer">
            <a th:href="@{/flights}" class="btn btn-secondary">Înapoi</a>
        </div>
    </div>
</div>
</body>
</html>
