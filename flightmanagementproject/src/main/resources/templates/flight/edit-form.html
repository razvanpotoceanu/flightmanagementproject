<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editează Zbor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1>Editează Zbor</h1>
    <form th:action="@{/flights/{id}/edit(id=${flight.id})}" th:object="${flight}" method="post" class="card p-4 shadow-sm">

        <div class="mb-3">
            <label class="form-label">ID:</label>
            <input type="text" th:field="*{id}" readonly class="form-control bg-light">
        </div>

        <div class="mb-3">
            <label class="form-label">Număr Zbor:</label>
            <input type="text" th:field="*{flightNumber}" class="form-control" th:classappend="${#fields.hasErrors('flightNumber')} ? 'is-invalid' : ''">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('flightNumber')}" th:errors="*{flightNumber}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Ora Plecare:</label>
            <input type="text" th:field="*{departureTime}" class="form-control" th:classappend="${#fields.hasErrors('departureTime')} ? 'is-invalid' : ''">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('departureTime')}" th:errors="*{departureTime}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Ora Sosire:</label>
            <input type="text" th:field="*{arrivalTime}" class="form-control" th:classappend="${#fields.hasErrors('arrivalTime')} ? 'is-invalid' : ''">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('arrivalTime')}" th:errors="*{arrivalTime}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Avion:</label>
            <select th:field="*{airplane}" class="form-select" th:classappend="${#fields.hasErrors('airplane')} ? 'is-invalid' : ''">
                <option value="">-- Alege Avion --</option>
                <option th:each="plane : ${airplanes}" th:value="${plane.id}" th:text="${plane.modelName + ' (' + plane.capacity + ')'}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('airplane')}" th:errors="*{airplane}"></div>
        </div>

        <button type="submit" class="btn btn-warning">Actualizează</button>
        <a th:href="@{/flights}" class="btn btn-secondary">Anulează</a>
    </form>
</div>
</body>
</html>
