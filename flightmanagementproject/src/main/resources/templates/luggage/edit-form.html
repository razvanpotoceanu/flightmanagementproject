<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Editează Bagaj</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1>Editează Bagaj</h1>
    <form th:action="@{/luggage/{id}/edit(id=${luggage.id})}" th:object="${luggage}" method="post" class="card p-4 shadow-sm">

        <div class="mb-3">
            <label class="form-label">ID:</label>
            <input type="text" th:field="*{id}" readonly class="form-control bg-light">
        </div>

        <div class="mb-3">
            <label class="form-label">Bilet:</label>
            <select th:field="*{ticket}" class="form-select" th:classappend="${#fields.hasErrors('ticket')} ? 'is-invalid' : ''">
                <option th:each="t : ${tickets}"
                        th:value="${t.id}"
                        th:text="${'ID: ' + t.id + ' (Loc: ' + t.seatNumber + ' - ' + (t.passenger != null ? t.passenger.name : 'Fără Pasager') + ')'}">
                </option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('ticket')}" th:errors="*{ticket}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Status:</label>
            <select th:field="*{status}" class="form-select" th:classappend="${#fields.hasErrors('status')} ? 'is-invalid' : ''">
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
        </div>

        <button type="submit" class="btn btn-warning">Actualizează</button>
        <a th:href="@{/luggage}" class="btn btn-secondary">Anulează</a>
    </form>
</div>
</body>
</html>
