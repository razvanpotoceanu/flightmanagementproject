<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Detalii Panou</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h2>Detalii Panou</h2>
        </div>
        <div class="card-body">
            <p><strong>ID:</strong> <span th:text="${noticeboard.id}"></span></p>
            <p><strong>Data:</strong> <span th:text="${noticeboard.date}"></span></p>

            <h4 class="mt-4">Zboruri pe acest Panou:</h4>
            <ul class="list-group" th:if="${not #lists.isEmpty(noticeboard.flightsOfTheDay)}">
                <li class="list-group-item" th:each="f : ${noticeboard.flightsOfTheDay}" th:text="${f.flightNumber + ' (' + f.departureTime + ' - ' + f.arrivalTime + ')'}"></li>
            </ul>
            <p th:if="${#lists.isEmpty(noticeboard.flightsOfTheDay)}" class="text-muted">Niciun zbor asociat.</p>
        </div>
        <div class="card-footer">
            <a th:href="@{/noticeboards}" class="btn btn-secondary">Înapoi</a>
            <a th:href="@{/noticeboards/{id}/edit(id=${noticeboard.id})}" class="btn btn-warning">Editează</a>
        </div>
    </div>
</div>
</body>
</html>
