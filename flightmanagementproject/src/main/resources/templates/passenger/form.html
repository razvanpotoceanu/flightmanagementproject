<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Adaugă Pasager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1>Adaugă Pasager</h1>
    <form th:action="@{/passengers}" th:object="${passenger}" method="post" class="card p-4 shadow-sm">

        <div class="mb-3">
            <label class="form-label">Nume:</label>
            <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email:</label>
            <input type="text" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Valută:</label>
            <input type="text" th:field="*{currency}" class="form-control" th:classappend="${#fields.hasErrors('currency')} ? 'is-invalid' : ''">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('currency')}" th:errors="*{currency}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Salvează</button>
        <a th:href="@{/passengers}" class="btn btn-secondary">Înapoi</a>
    </form>
</div>
</body>
</html>
