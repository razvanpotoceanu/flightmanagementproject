<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Adaugă Bilet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h1>Adaugă Bilet Nou</h1>
    <form th:action="@{/tickets}" th:object="${ticket}" method="post" class="card p-4 shadow-sm">

        <div class="mb-3">
            <label class="form-label">Loc:</label>
            <input type="text" th:field="*{seatNumber}" class="form-control" th:classappend="${#fields.hasErrors('seatNumber')} ? 'is-invalid' : ''">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('seatNumber')}" th:errors="*{seatNumber}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Preț:</label>
            <input type="number" step="0.01" th:field="*{price}" class="form-control" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''">
            <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Pasager:</label>
            <select th:field="*{passenger}" class="form-select" th:classappend="${#fields.hasErrors('passenger')} ? 'is-invalid' : ''">
                <option value="">-- Alege Pasager --</option>
                <option th:each="p : ${passengers}" th:value="${p.id}" th:text="${p.name + ' (' + p.email + ')'}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('passenger')}" th:errors="*{passenger}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Zbor:</label>
            <select th:field="*{flight}" class="form-select" th:classappend="${#fields.hasErrors('flight')} ? 'is-invalid' : ''">
                <option value="">-- Alege Zbor --</option>
                <option th:each="f : ${flights}" th:value="${f.id}" th:text="${f.flightNumber + ' (' + f.departureTime + ')'}"></option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('flight')}" th:errors="*{flight}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Salvează</button>
        <a th:href="@{/tickets}" class="btn btn-secondary">Înapoi</a>
    </form>
</div>
</body>
</html>
