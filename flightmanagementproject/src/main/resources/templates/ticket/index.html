<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista Bilete</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"><i class="fas fa-plane"></i> FlightApp</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/passengers}">Pasageri</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/flights}">Zboruri</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/airplanes}">Avioane</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/tickets}">Bilete</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/assignments}">Asignări</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Staff</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/airline-employees}">Companie</a></li>
                        <li><a class="dropdown-item" th:href="@{/airport-employees}">Aeroport</a></li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-primary">Management Bilete</h1>
        <div>
            <a th:href="@{/tickets/new}" class="btn btn-success"><i class="fas fa-plus"></i> Adaugă Bilet</a>
            <a th:href="@{/}" class="btn btn-secondary">Acasă</a>
        </div>
    </div>

    <!-- Nu am implementat filtrare complexă aici încă, dar punem sortarea -->
    <div class="card shadow-sm">
        <table class="table table-striped table-hover mb-0">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Loc</th>
                <th>Preț</th>
                <th>Pasager</th>
                <th>Zbor</th>
                <th>Acțiuni</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ticket : ${tickets}">
                <td th:text="${ticket.id}"></td>
                <td th:text="${ticket.seatNumber}"></td>
                <td th:text="${ticket.price}"></td>

                <!-- Navigare prin obiecte -->
                <td th:text="${ticket.passenger != null ? ticket.passenger.name : '-'}"></td>
                <td th:text="${ticket.flight != null ? ticket.flight.flightNumber : '-'}"></td>

                <td>
                    <a th:href="@{/tickets/{id}(id=${ticket.id})}" class="btn btn-sm btn-info"><i class="fas fa-info-circle"></i></a>
                    <a th:href="@{/tickets/{id}/edit(id=${ticket.id})}" class="btn btn-sm btn-warning"><i class="fas fa-edit"></i></a>
                    <form th:action="@{/tickets/{id}/delete(id=${ticket.id})}" method="post" style="display:inline;" onsubmit="return confirm('Ștergi?');">
                        <button type="submit" class="btn btn-sm btn-danger"><i class="fas fa-trash"></i></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-3">
        <a th:href="@{/flights}" class="btn btn-outline-primary btn-sm">Înapoi la Zboruri</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
