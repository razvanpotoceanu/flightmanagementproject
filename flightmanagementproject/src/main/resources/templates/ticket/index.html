<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista Bilete</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-primary">Management Bilete</h1>
        <div>
            <a th:href="@{/tickets/new}" class="btn btn-success"><i class="fas fa-plus"></i> Adaugă Bilet</a>
            <a th:href="@{/}" class="btn btn-secondary">Acasă</a>
        </div>
    </div>

    <!-- Formular Filtrare -->
    <form th:action="@{/tickets}" method="get" class="card p-3 mb-4 shadow-sm">
        <div class="input-group">
            <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Caută după loc sau nume pasager...">
            <input type="hidden" name="sortField" th:value="${sortField}">
            <input type="hidden" name="sortDir" th:value="${sortDir}">
            <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i> Caută</button>
            <a th:href="@{/tickets}" class="btn btn-outline-secondary">Reset</a>
        </div>
    </form>

    <div class="card shadow-sm">
        <table class="table table-striped table-hover mb-0">
            <thead class="table-dark">
            <tr>
                <th>
                    <a th:href="@{/tickets(sortField='id', sortDir=${reverseSortDir}, keyword=${keyword})}" class="text-white text-decoration-none">
                        ID <i th:if="${sortField == 'id'}" th:class="${sortDir == 'asc' ? 'fas fa-sort-up' : 'fas fa-sort-down'}"></i>
                    </a>
                </th>
                <th>
                    <a th:href="@{/tickets(sortField='seatNumber', sortDir=${reverseSortDir}, keyword=${keyword})}" class="text-white text-decoration-none">
                        Loc <i th:if="${sortField == 'seatNumber'}" th:class="${sortDir == 'asc' ? 'fas fa-sort-up' : 'fas fa-sort-down'}"></i>
                    </a>
                </th>
                <th>Preț</th>
                <th>Pasager</th>
                <th>Zbor</th>
                <th>Acțiuni</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ticket : ${tickets}">
                <td th:text="${ticket.id}"></td>
                <td th:text="${ticket.seatNumber}"></td>
                <td th:text="${ticket.price}"></td>
                <td th:text="${ticket.passenger != null ? ticket.passenger.name : '-'}"></td>
                <td th:text="${ticket.flight != null ? ticket.flight.flightNumber : '-'}"></td>
                <td>
                    <a th:href="@{/tickets/{id}(id=${ticket.id})}" class="btn btn-sm btn-info"><i class="fas fa-info-circle"></i></a>
                    <a th:href="@{/tickets/{id}/edit(id=${ticket.id})}" class="btn btn-sm btn-warning"><i class="fas fa-edit"></i></a>
                    <form th:action="@{/tickets/{id}/delete(id=${ticket.id})}" method="post" style="display:inline;" onsubmit="return confirm('Ștergi acest bilet?');">
                        <button type="submit" class="btn btn-sm btn-danger"><i class="fas fa-trash"></i></button>
                    </form>
                </td>
            </tr>
            <tr th:if="${tickets.empty}">
                <td colspan="6" class="text-center text-muted">Nu s-au găsit bilete.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-3">
        <a th:href="@{/flights}" class="btn btn-outline-primary btn-sm">Înapoi la Zboruri</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
